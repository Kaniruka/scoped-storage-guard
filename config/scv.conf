# Scoped Storage Guard policy. Root-only; installed as <module>/config/scv.conf.
# Child names and complete UIDs come from two matching full PM queries;
# healthy 20-second cycles renew a 180000ms kernel lease; an expired lease
# stops enforcing instead of denying app children. Everything is either
# explicit or verified at boot; nothing is inferred from
# a device name, a model or an Android version.

# Users to cover. "auto" covers every user that "pm list users" reports as
# running. Numeric values are explicit and verified against the same list;
# repeat the line for several users.
user=auto

# Packages whose real UIDs join the allowlist. Repeatable: every verified UID
# is authorized on every root. Leave empty or set provider_uid=off to disable.
# provider_uid=auto uses the UIDs PackageManager reports; a number requires
# that exact UID to be among them.
#
# The platform download provider is required in practice: DownloadManager
# creates the destination directory inside the requesting app's
# Android/data/<pkg> with its own UID, so without it every download to an
# external files dir fails (app stores report a download error, apps that
# fetch resources report "no network").
provider_package=com.android.providers.media.module
provider_package=com.android.providers.downloads
provider_uid=auto

# Base identities that always keep access (documented kernel identities).
allow_uid=0
allow_uid=1000

# Explicit per-kind FUSE mappings, used when automatic discovery has no usable
# FUSE object (for example a whole-F2FS overmount). {user} is required.
# fuse_root expands to <root>/Android/data and <root>/Android/obb.
# fuse_data / fuse_obb name the complete directory for that kind and take
# precedence over fuse_root. A configured mapping must resolve to a real FUSE
# object; a non-FUSE or missing mapping blocks publishing instead of falling
# back to an alias.
# fuse_root=/mnt/user/0/emulated/{user}
# fuse_data=/mnt/user/0/emulated/{user}/Android/data
# fuse_obb=/mnt/user/0/emulated/{user}/Android/obb

# Filesystem types accepted for the raw lower objects.
fs_allow=fuse,f2fs,ext4
